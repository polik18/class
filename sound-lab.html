<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>闖關音效試聽室｜智慧課堂助手</title>
  <meta name="description" content="智慧課堂助手闖關模式的原創音樂與音效試聽：大廳、思考倒數、揭曉、排行榜、頒獎與答題音效，全部以 Web Audio 即時合成。">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#05070d">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;600;700&display=swap">
  <script src="https://polik18.github.io/assets/polik-shell.js" data-cat="education" data-skin="neo" data-grain="off" data-accent="#818cf8" data-accent2="#f472b6" data-accent3="#a855f7" data-side="left" defer></script>
  <style>
    :root { --bg: #05070d; --card: rgba(14, 20, 36, .72); --line: rgba(148, 163, 196, .2); --ink: #eef3fb; --muted: #8a99b3; --a: #818cf8; --b: #f472b6; --g: #34d399; --y: #fbbf24; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: "Space Grotesk", "Noto Sans TC", system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 120px; }
    .kicker { font: 700 11px/1 "JetBrains Mono", monospace; letter-spacing: .28em; color: #a5b4fc; }
    .kicker b { background: linear-gradient(90deg, var(--a), var(--b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 10px 0 6px; font-size: clamp(28px, 5vw, 44px); font-weight: 900; }
    .lead { color: var(--muted); margin: 0 0 22px; line-height: 1.7; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; backdrop-filter: blur(14px); }
    .card h2 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .card h2 small { color: var(--muted); font-weight: 500; font-size: 12px; }
    button { font: inherit; cursor: pointer; border: 1px solid var(--line); color: var(--ink); background: rgba(148, 163, 196, .08); border-radius: 14px; padding: 12px 14px; transition: transform .15s, background .2s, border-color .2s; text-align: left; }
    button:hover { background: rgba(148, 163, 196, .16); border-color: rgba(148, 163, 196, .4); }
    button:active { transform: scale(.97); }
    button.on { border-color: var(--a); background: linear-gradient(115deg, rgba(99, 102, 241, .35), rgba(236, 72, 153, .25)); box-shadow: 0 0 24px -6px rgba(168, 85, 247, .8); }
    .track { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .track b { font-size: 15px; }
    .track span { color: var(--muted); font-size: 12px; }
    .tracks { display: grid; gap: 10px; }
    .sfx { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .sfx button { text-align: center; font-size: 13px; padding: 12px 8px; }
    .row { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
    .row label { width: 64px; color: var(--muted); font-size: 13px; }
    .row input { flex: 1; accent-color: var(--a); }
    .row button { flex: 1; white-space: nowrap; text-align: center; padding: 10px 8px; font-size: 13px; }
    .row output { width: 40px; text-align: right; font: 600 13px "JetBrains Mono", monospace; }
    .hero { display: grid; gap: 16px; grid-template-columns: 1.4fr 1fr; margin-bottom: 16px; }
    @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
    canvas { width: 100%; height: 150px; display: block; border-radius: 14px; background: rgba(4, 7, 14, .7); }
    .demo { display: flex; flex-direction: column; gap: 12px; }
    .stage { position: relative; height: 150px; border-radius: 14px; background: radial-gradient(80% 90% at 50% 0%, rgba(129, 140, 248, .25), transparent 70%), rgba(4, 7, 14, .7); display: grid; place-items: center; overflow: hidden; }
    .stage .phase { font: 700 11px/1 "JetBrains Mono", monospace; letter-spacing: .25em; color: #c7d2fe; position: absolute; top: 12px; left: 14px; }
    .stage .big { font-size: 54px; font-weight: 900; font-family: "JetBrains Mono", monospace; }
    .ring { position: absolute; inset: 0; margin: auto; width: 120px; height: 120px; }
    .ring circle { fill: none; stroke-width: 8; }
    .urgent .big { color: #fb7185; animation: pulse .5s infinite alternate; }
    @keyframes pulse { to { transform: scale(1.12); } }
    .primary { background: linear-gradient(115deg, #6366f1, #a855f7 55%, #ec4899); border: none; text-align: center; font-weight: 900; font-size: 16px; padding: 14px; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 18px; }
    .unlock { position: fixed; inset: 0; z-index: 50; background: rgba(5, 7, 13, .86); backdrop-filter: blur(8px); display: grid; place-items: center; }
    .unlock button { font-size: 18px; padding: 18px 28px; }
    @media (prefers-reduced-motion: reduce) { .urgent .big { animation: none; } }
  </style>
</head>
<body>
  <div class="unlock" id="unlock">
    <button class="primary" type="button" onclick="startLab()">🔊 點一下開始試聽</button>
  </div>
  <main>
    <span class="kicker"><b>POLIK</b> · SOUND LAB</span>
    <h1>闖關音效試聽室</h1>
    <p class="lead">即時問答「闖關模式」的原創音樂與音效。全部由瀏覽器即時合成，沒有任何音樂檔，也沒有版權素材；離線也能播放。</p>

    <section class="hero">
      <div class="card demo">
        <h2>模擬一回合 <small>大廳 → 預告 → 倒數 15 秒 → 揭曉 → 排行 → 頒獎</small></h2>
        <div class="stage" id="stage">
          <span class="phase" id="phase">READY</span>
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" stroke="rgba(148,163,196,.18)"/><circle id="ringFg" cx="60" cy="60" r="52" stroke="url(#rg)" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="0" transform="rotate(-90 60 60)"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs></svg>
          <span class="big" id="big">▶</span>
        </div>
        <button class="primary" type="button" id="demoBtn" onclick="toggleDemo()">開始模擬</button>
      </div>
      <div class="card">
        <h2>混音</h2>
        <div class="row"><label for="v-master">主音量</label><input id="v-master" type="range" min="0" max="1" step="0.05"><output id="o-master"></output></div>
        <div class="row"><label for="v-music">音樂</label><input id="v-music" type="range" min="0" max="1" step="0.05"><output id="o-music"></output></div>
        <div class="row"><label for="v-sfx">音效</label><input id="v-sfx" type="range" min="0" max="1" step="0.05"><output id="o-sfx"></output></div>
        <div class="row"><label>老師說話</label><button type="button" id="duckBtn" onclick="toggleDuck()">壓低音樂（ducking）</button></div>
        <canvas id="viz" width="600" height="150" aria-label="音訊頻譜"></canvas>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>循環音樂 <small>投影幕播放</small></h2>
        <div class="tracks">
          <button type="button" data-music="lobby"><span class="track"><b>大廳 Lobby</b><span>112 BPM · C 大調 · 等待學生加入</span></span></button>
          <button type="button" data-music="think"><span class="track"><b>思考 Think</b><span>128 BPM · A 小調 · 作答倒數</span></span></button>
        </div>
        <div class="row" style="margin-top:14px"><label>緊張度</label>
          <button type="button" data-int="0">一般</button><button type="button" data-int="1">剩 10 秒</button><button type="button" data-int="2">剩 5 秒</button>
        </div>
        <button type="button" onclick="IrsSound.stopMusic(); markMusic(null)" style="width:100%">■ 停止音樂</button>
      </section>
      <section class="card">
        <h2>樂段 <small>一次性</small></h2>
        <div class="tracks">
          <button type="button" data-sting="reveal"><span class="track"><b>揭曉 Reveal</b><span>公布答案</span></span></button>
          <button type="button" data-sting="board"><span class="track"><b>排行 Board</b><span>鼓聲滾奏＋重音</span></span></button>
          <button type="button" data-sting="podium"><span class="track"><b>頒獎 Podium</b><span>原創號角主題</span></span></button>
        </div>
      </section>
      <section class="card">
        <h2>音效</h2>
        <div class="sfx">
          <button type="button" data-sfx="join">學生加入</button>
          <button type="button" data-sfx="riser">題目預告</button>
          <button type="button" data-sfx="tick">倒數滴答</button>
          <button type="button" data-sfx="tickUrgent">最後 5 秒</button>
          <button type="button" data-sfx="timeUp">時間到</button>
          <button type="button" data-sfx="tap">按下選項</button>
          <button type="button" data-sfx="correct">答對</button>
          <button type="button" data-sfx="wrong">答錯</button>
          <button type="button" data-sfx="streak">連對</button>
          <button type="button" data-sfx="rankUp">名次上升</button>
          <button type="button" data-sfx="podium3">第三名</button>
          <button type="button" data-sfx="podium2">第二名</button>
          <button type="button" data-sfx="podium1">第一名</button>
        </div>
      </section>
    </div>
    <p class="note">設計說明：背景音樂只在投影幕播放；學生手機只播按鍵、答對、答錯等短音效並震動，避免全班手機一起響。音量設定會記在這台裝置上，正式遊戲模式會沿用。iPhone 側邊靜音開關開啟時網頁無法出聲。</p>
  </main>

  <script src="js/pro/irs-sound.js"></script>
  <script>
    const S = window.IrsSound;
    const $ = id => document.getElementById(id);

    window.startLab = () => {
      S.unlock();
      $('unlock').remove();
      drawViz();
    };

    ['master', 'music', 'sfx'].forEach(k => {
      const input = $('v-' + k), out = $('o-' + k);
      input.value = S.settings[k];
      out.textContent = Math.round(S.settings[k] * 100);
      input.addEventListener('input', () => { S.setVolume(k, input.value); out.textContent = Math.round(input.value * 100); });
    });

    const markMusic = name => document.querySelectorAll('[data-music]').forEach(b => b.classList.toggle('on', b.dataset.music === name));
    const markInt = lvl => document.querySelectorAll('[data-int]').forEach(b => b.classList.toggle('on', Number(b.dataset.int) === lvl));
    window.markMusic = markMusic;
    document.querySelectorAll('[data-music]').forEach(b => b.addEventListener('click', () => { S.playMusic(b.dataset.music); markMusic(b.dataset.music); markInt(S.intensity); }));
    document.querySelectorAll('[data-int]').forEach(b => b.addEventListener('click', () => { S.setIntensity(Number(b.dataset.int)); markInt(Number(b.dataset.int)); }));
    document.querySelectorAll('[data-sting]').forEach(b => b.addEventListener('click', () => S.stinger(b.dataset.sting)));
    document.querySelectorAll('[data-sfx]').forEach(b => b.addEventListener('click', () => S.sfx(b.dataset.sfx)));
    markInt(0);

    window.toggleDuck = () => { S.duck(!S.ducked); $('duckBtn').classList.toggle('on', S.ducked); };

    // 頻譜
    function drawViz() {
      const cv = $('viz'), g = cv.getContext('2d'), an = S.analyser, data = new Uint8Array(an.frequencyBinCount);
      const loop = () => {
        an.getByteFrequencyData(data);
        g.clearRect(0, 0, cv.width, cv.height);
        const bars = 64, w = cv.width / bars;
        for (let i = 0; i < bars; i++) {
          const v = data[Math.floor(i * data.length / bars / 1.6)] / 255, h = Math.max(2, v * cv.height * .92);
          const grad = g.createLinearGradient(0, cv.height, 0, cv.height - h);
          grad.addColorStop(0, '#818cf8'); grad.addColorStop(1, '#f472b6');
          g.fillStyle = grad; g.fillRect(i * w + 1, cv.height - h, w - 2, h);
        }
        requestAnimationFrame(loop);
      };
      loop();
    }

    // 模擬一回合
    let demoTimers = [];
    const later = (ms, fn) => demoTimers.push(setTimeout(fn, ms));
    const setStage = (phase, big, urgent = false, ratio = null) => {
      $('phase').textContent = phase; $('big').textContent = big;
      $('stage').classList.toggle('urgent', urgent);
      if (ratio !== null) $('ringFg').style.strokeDashoffset = String(326.7 * (1 - ratio));
    };
    window.toggleDemo = () => {
      if (demoTimers.length) { stopDemo(); return; }
      $('demoBtn').textContent = '停止模擬';
      S.duck(false);
      S.playMusic('lobby'); markMusic('lobby'); setStage('LOBBY · 等待加入', '0', false, 1);
      for (let i = 1; i <= 5; i++) later(i * 700, () => { S.sfx('join'); setStage('LOBBY · 等待加入', String(i)); });
      later(4600, () => { S.stopMusic(0.4); markMusic(null); S.sfx('riser'); setStage('PREVIEW · 第 1 題', '3', false, 1); });
      later(5600, () => setStage('PREVIEW · 第 1 題', '2'));
      later(6200, () => setStage('PREVIEW · 第 1 題', '1'));
      const T = 15, start = 6300;
      later(start, () => { S.playMusic('think'); markMusic('think'); markInt(0); });
      for (let s = T; s >= 1; s--) {
        later(start + (T - s) * 1000, () => {
          const lvl = s <= 5 ? 2 : s <= 10 ? 1 : 0;
          if (lvl !== S.intensity) { S.setIntensity(lvl); markInt(lvl); }
          if (s <= 5) S.sfx('tickUrgent'); else if (s <= 10) S.sfx('tick');
          setStage('ANSWER · 作答中', String(s), s <= 5, s / T);
          if (s === 12 || s === 9 || s === 7) S.sfx('tap');
        });
      }
      const end = start + T * 1000;
      later(end, () => { S.stopMusic(0.15); markMusic(null); S.sfx('timeUp'); setStage('TIME UP', '0', false, 0); });
      later(end + 1500, () => { S.stinger('reveal'); setStage('REVEAL · 揭曉', 'B ✓'); });
      later(end + 2200, () => S.sfx('correct'));
      later(end + 3000, () => S.sfx('streak'));
      later(end + 4200, () => { S.stinger('board'); setStage('LEADERBOARD', '🏆'); });
      later(end + 6000, () => S.sfx('rankUp'));
      later(end + 7500, () => { S.sfx('podium3'); setStage('PODIUM', '3'); });
      later(end + 8700, () => { S.sfx('podium2'); setStage('PODIUM', '2'); });
      later(end + 9900, () => { S.stinger('podium'); S.sfx('podium1'); setStage('PODIUM', '1'); });
      later(end + 18500, stopDemo);
    };
    function stopDemo() {
      demoTimers.forEach(clearTimeout); demoTimers = [];
      S.stopMusic(0.4); markMusic(null);
      $('demoBtn').textContent = '開始模擬';
      setStage('READY', '▶', false, 1);
    }
  </script>
</body>
</html>
